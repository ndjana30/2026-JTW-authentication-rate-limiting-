# Spring Boot Application Configuration
spring.application.name=jwt-rate-limiting-auth
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Configuration (Update with your database credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/authentication_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret-key=your-secret-key-min-256-characters-long-to-ensure-proper-hs256-encryption
app.jwt.expiration=86400000

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OAuth2 Redirect URIs
app.oauth2.redirect-uri=http://localhost:3000/auth/callback
app.oauth2.failure-redirect-uri=http://localhost:3000/auth/login?error=oauth2
